services:
  # -------------------------------------------------------------
  # 1. TeamBee Backend Web Service (Node.js + Prisma + Socket.IO)
  # -------------------------------------------------------------
  - type: web
    name: teambee-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "none"
      - key: COOKIE_SECURE
        value: "true"
      - key: META_ALLOW_MOCK
        value: "false"
      - key: ENABLE_SIMULATOR
        value: "false"
      - key: RLS_CONTEXT
        value: "off"
      - key: JWT_SECRET
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: META_API_VERSION
        value: "v20.0"
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLIENT_URL
        sync: false
      # Cloudflare R2 Object Storage (S3-Compatible)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false

  # -------------------------------------------------------------
  # 2. TeamBee Frontend Static Site (Vite + React)
  # -------------------------------------------------------------
  - type: web
    runtime: static
    name: teambee-frontend
    region: oregon
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: teambee-backend
          property: host
